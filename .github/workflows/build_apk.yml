name: Build Fazlaka Pay APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Ensure Android platform files exist
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            flutter create --platforms=android --org com.fazlaka.pay .
          fi
      - name: Fix MainActivity for fingerprint
        run: |
          cat > android/app/src/main/kotlin/com/fazlaka/pay/MainActivity.kt <<'EOF'
          package com.fazlaka.pay
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity : FlutterFragmentActivity()
          EOF
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze project
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fazlaka-pay-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
