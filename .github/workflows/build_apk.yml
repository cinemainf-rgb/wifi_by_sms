name: Build Fazlaka Pay APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # الخطوة دي بتعمل الفولدر لو مش موجود، وبتعدل الملفات "بالعافية"
      - name: Force Fix Android Native for Biometrics
        run: |
          # 1. إنشاء الفولدر لو مش موجود
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.fazlaka.pay .
          fi
          
          # 2. إجبار الماين أكتيفيتي يبقى FragmentActivity (في أي مكان)
          find android -name "MainActivity.kt" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} +
          find android -name "MainActivity.java" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} +
          
          # 3. إضافة صلاحية البصمة (بندور على الملف في أي مسار ونضيف الصلاحية)
          MANIFEST_PATH=$(find android -name "AndroidManifest.xml" | head -n 1)
          if [ -n "$MANIFEST_PATH" ]; then
            if ! grep -q "USE_BIOMETRIC" "$MANIFEST_PATH"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' "$MANIFEST_PATH"
            fi
          else
            echo "Manifest not found!"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fazlaka-pay-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
