name: Build Fazlaka Pay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android platform files exist
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create --org com.fazlaka.pay --project-name wifi_by_sms .
          fi

      - name: Fix MainActivity for fingerprint
        run: |
          echo "--- Before fix ---"
          find android -name "MainActivity*" || true
          rm -rf android/app/src/main/java/com/fazlaka/pay
          mkdir -p android/app/src/main/kotlin/com/fazlaka/pay
          cat > android/app/src/main/kotlin/com/fazlaka/pay/MainActivity.kt <<'EOF'
          package com.fazlaka.pay
          import io.flutter.embedding.android.FlutterFragmentActivity
          class MainActivity : FlutterFragmentActivity()
          EOF
          echo "--- After fix ---"
          find android -name "MainActivity*"
          cat android/app/src/main/kotlin/com/fazlaka/pay/MainActivity.kt

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fazlaka-pay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
