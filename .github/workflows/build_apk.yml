name: Build Fazlaka Pay APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android platform files exist
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create --org com.fazlaka.pay --project-name wifi_by_sms .
          fi

      - name: Fix MainActivity for fingerprint
        run: |
          mkdir -p android/app/src/main/kotlin/com/fazlaka/pay
          cat > android/app/src/main/kotlin/com/fazlaka/pay/MainActivity.kt <<'EOF'
          package com.fazlaka.pay
          import android.hardware.biometrics.BiometricPrompt
          import android.os.Build
          import android.os.CancellationSignal
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity : FlutterActivity() {
              private val CHANNEL = "fazlaka/biometric"
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "authenticate") {
                          authenticate(result)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
              private fun authenticate(result: MethodChannel.Result) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.P) {
                      result.success(false)
                      return
                  }
                  val prompt = BiometricPrompt.Builder(this)
                      .setTitle("Fazlaka Pay")
                      .setSubtitle("حط صباعك عشان تفتح فزلكة")
                      .setNegativeButton("إلغاء", mainExecutor) { _, _ -> result.success(false) }
                      .build()
                  val cancel = CancellationSignal()
                  prompt.authenticate(cancel, mainExecutor, object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(r: BiometricPrompt.AuthenticationResult?) {
                          result.success(true)
                      }
                      override fun onAuthenticationError(code: Int, msg: CharSequence?) {
                          result.success(false)
                      }
                  })
              }
          }
          EOF
          cat android/app/src/main/kotlin/com/fazlaka/pay/MainActivity.kt

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fazlaka-pay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
